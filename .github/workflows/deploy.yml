# Build Next.js (standalone) lalu upload ke cPanel lewat FTPS setiap ada push ke main.
# Pull request hanya di-build (cek tidak rusak), tidak di-deploy.
#
# Secrets repo (Settings → Secrets and variables → Actions):
#   FTP_SERVER      mis. empatsaudarafarma.com
#   FTP_USERNAME    akun FTP cPanel
#   FTP_PASSWORD
#   FTP_SERVER_DIR  folder aplikasi relatif dari root akun FTP, diakhiri "/" (mis. empatsaudarafarma/)
name: Deploy

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: deploy-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build-deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      SITE_URL: https://empatsaudarafarma.com
      FTP_SERVER: ${{ secrets.FTP_SERVER }}
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      # next build sekaligus menjalankan pengecekan TypeScript
      - run: pnpm build

      - run: node scripts/build-deploy.mjs --no-zip

      - name: Upload ke cPanel
        if: github.event_name != 'pull_request' && env.FTP_SERVER != ''
        uses: SamKirkland/FTP-Deploy-Action@v4.3.5
        with:
          server: ${{ secrets.FTP_SERVER }}
          username: ${{ secrets.FTP_USERNAME }}
          password: ${{ secrets.FTP_PASSWORD }}
          protocol: ftps
          local-dir: deploy/app/
          server-dir: ${{ secrets.FTP_SERVER_DIR }}
          # Default action ini melewati node_modules, padahal build standalone membutuhkannya
          exclude: |
            **/.git*
            **/.git*/**
