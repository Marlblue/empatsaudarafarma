# Build Next.js (standalone) lalu upload ke cPanel lewat FTPS (lftp) setiap ada push ke main.
# Pull request hanya di-build (cek tidak rusak), tidak di-deploy.
#
# Secrets repo (Settings → Secrets and variables → Actions):
#   FTP_SERVER      mis. empatsaudarafarma.com
#   FTP_USERNAME    akun FTP cPanel
#   FTP_PASSWORD
#   FTP_SERVER_DIR  folder aplikasi relatif dari root akun FTP (./ bila akun FTP langsung ke folder aplikasi)
name: Deploy

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: deploy-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build-deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      SITE_URL: https://empatsaudarafarma.com
      FTP_SERVER: ${{ secrets.FTP_SERVER }}
    steps:
      - uses: actions/checkout@v5

      - uses: pnpm/action-setup@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      # next build sekaligus menjalankan pengecekan TypeScript
      - run: pnpm build

      - run: node scripts/build-deploy.mjs --no-zip

      # Tanpa downtime: tiap deploy diunggah utuh ke releases/<waktu>-<commit>/ selagi versi lama tetap
      # melayani. Setelah selesai, RELEASE menunjuk ke rilis baru, server.js (peluncur) dipasang, lalu
      # tmp/restart.txt memicu Passenger memuat rilis baru sekaligus. 3 rilis terbaru disimpan untuk rollback.
      # node_modules dipakai bersama di folder aplikasi dan hanya diunggah bila isinya berubah.
      # --dereference: server FTP tidak mendukung symlink, jadi isi file tujuannya yang diunggah.
      - name: Upload ke cPanel
        if: github.event_name != 'pull_request' && env.FTP_SERVER != ''
        env:
          FTP_USERNAME: ${{ secrets.FTP_USERNAME }}
          FTP_PASSWORD: ${{ secrets.FTP_PASSWORD }}
          FTP_SERVER_DIR: ${{ secrets.FTP_SERVER_DIR }}
        working-directory: deploy/app
        run: |
          sudo apt-get update -qq > /dev/null && sudo apt-get install -y -qq lftp > /dev/null
          export LFTP_PASSWORD="$FTP_PASSWORD"
          DIR="${FTP_SERVER_DIR:-./}"
          REL="$(date -u +%Y%m%d%H%M%S)-${GITHUB_SHA::7}"
          echo "$REL" > ../RELEASE
          ftp_cmd() {
            lftp --env-password -u "$FTP_USERNAME" "$FTP_SERVER" \
              -e "set ftp:ssl-force true; set ssl:verify-certificate no; set net:max-retries 2; set net:timeout 20; $1; bye"
          }

          NM_HASH=$(cd node_modules && find . -type f -print0 | sort -z | xargs -0 sha256sum | sha256sum | cut -d' ' -f1)
          echo "$NM_HASH" > ../node_modules.sha256
          REMOTE_HASH=$(ftp_cmd "cat \"$DIR/.node_modules.sha256\"" 2>/dev/null || true)
          if [ "$NM_HASH" = "$REMOTE_HASH" ]; then
            echo "node_modules tidak berubah, dilewati"
            NM_CMD="echo node_modules dilewati"
          else
            NM_CMD="mirror -R --dereference --parallel=10 node_modules node_modules; put ../node_modules.sha256 -o .node_modules.sha256"
          fi

          lftp --env-password -u "$FTP_USERNAME" "$FTP_SERVER" <<EOF
          set ftp:ssl-force true
          set ftp:ssl-protect-data true
          set ssl:verify-certificate no
          set net:max-retries 3
          set net:timeout 30
          set cmd:fail-exit true
          cd "$DIR"
          $NM_CMD
          mkdir -pf releases
          mirror -R --dereference --parallel=10 -x '^node_modules/' -x '^tmp/' . releases/$REL
          mirror -R --dereference --parallel=10 public public
          put ../RELEASE -o RELEASE
          put ../../scripts/passenger-server.cjs -o server.js
          mkdir -pf tmp
          put -O tmp tmp/restart.txt
          bye
          EOF
          echo "Rilis aktif: $REL"

          # Bersihkan rilis lama (simpan 3 terbaru); website sudah memakai rilis baru
          for old in $(ftp_cmd "cls -1 \"$DIR/releases/\"" | sed 's#/$##; s#.*/##' | sort | head -n -3); do
            echo "Hapus rilis lama: $old"
            ftp_cmd "rm -r \"$DIR/releases/$old\"" || true
          done
