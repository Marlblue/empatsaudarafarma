# Build Next.js (standalone) lalu upload ke cPanel lewat FTPS (lftp) setiap ada push ke main.
# Pull request hanya di-build (cek tidak rusak), tidak di-deploy.
#
# Secrets repo (Settings → Secrets and variables → Actions):
#   FTP_SERVER      mis. empatsaudarafarma.com
#   FTP_USERNAME    akun FTP cPanel
#   FTP_PASSWORD
#   FTP_SERVER_DIR  folder aplikasi relatif dari root akun FTP (./ bila akun FTP langsung ke folder aplikasi)
name: Deploy

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: deploy-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build-deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      SITE_URL: https://empatsaudarafarma.com
      FTP_SERVER: ${{ secrets.FTP_SERVER }}
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      # next build sekaligus menjalankan pengecekan TypeScript
      - run: pnpm build

      - run: node scripts/build-deploy.mjs --no-zip

      # lftp: 10 file paralel. Urutan: aset statis baru dulu (aditif, halaman lama tetap jalan),
      # lalu kode server, terakhir tmp/restart.txt agar Passenger memuat versi baru sekaligus.
      - name: Upload ke cPanel
        if: github.event_name != 'pull_request' && env.FTP_SERVER != ''
        env:
          FTP_USERNAME: ${{ secrets.FTP_USERNAME }}
          FTP_PASSWORD: ${{ secrets.FTP_PASSWORD }}
          FTP_SERVER_DIR: ${{ secrets.FTP_SERVER_DIR }}
        working-directory: deploy/app
        run: |
          sudo apt-get update -qq > /dev/null && sudo apt-get install -y -qq lftp > /dev/null
          LFTP_PASSWORD="$FTP_PASSWORD" lftp --env-password -u "$FTP_USERNAME" "$FTP_SERVER" <<EOF
          set ftp:ssl-force true
          set ftp:ssl-protect-data true
          set ssl:verify-certificate no
          set net:max-retries 3
          set net:timeout 30
          set cmd:fail-exit true
          cd "${FTP_SERVER_DIR:-./}"
          mirror -R --parallel=10 .next/static .next/static
          mirror -R --parallel=10 public public
          mirror -R --parallel=10 node_modules node_modules
          mirror -R --parallel=10 -x '^\.next/static/' -x '^public/' -x '^node_modules/' -x '^tmp/' . .
          mkdir -pf tmp
          put -O tmp tmp/restart.txt
          bye
          EOF
